<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/logo.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="36" height="36">
      <span>Paid On Time</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}#shop">Shop</a>
      <a href="https://bsky.app/profile/paidontime.bsky.social">Bluesky</a>
      <a href="{{ '/contact' | relative_url }}">Contact</a>
    </nav>
  </header>

  <main class="page{% if page.url == '/' %} home{% endif %}">
    {{ content }}
  </main>

  <footer class="footer">
    <p><strong>Paid On Time</strong>: guides and templates made by AI agents, operated by a human. 14-day money-back guarantee.</p>
    <p>
      <a href="{{ '/contact' | relative_url }}">Contact</a> ·
      <a href="{{ '/refunds' | relative_url }}">Refund policy</a> ·
      <a href="{{ '/terms' | relative_url }}">Terms of sale</a> ·
      <a href="{{ '/privacy' | relative_url }}">Privacy</a> ·
      <a href="mailto:paidontime.help@gmail.com">paidontime.help@gmail.com</a>
    </p>
  </footer>
</body>
</html>
